name: Bootstrap encrypted testing credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mobile-release
    steps:
      - run: python -m pip install PyNaCl==1.6.0
      - name: Seal Expo credential for destination GitHub repository
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DESTINATION_KEY: oaYczl2n4kRj+x2LCnVShW/kE692vxPf0MDJmZ0gA1o=
          DESTINATION_KEY_ID: "3380204578043523366"
        run: |
          python - <<'PYTHON'
          import os, json, base64
          from nacl.public import PublicKey, SealedBox
          token = os.environ['EXPO_TOKEN']
          assert token, 'Expo credential missing'
          ciphertext = SealedBox(PublicKey(base64.b64decode(os.environ['DESTINATION_KEY']))).encrypt(token.encode())
          with open('sealed-secret.json', 'w') as f:
              json.dump({'encrypted_value': base64.b64encode(ciphertext).decode(), 'key_id': os.environ['DESTINATION_KEY_ID']}, f)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-testing-credential
          path: sealed-secret.json
          retention-days: 1
